<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuração inicial — Academia Velarian</title><link rel="stylesheet" href="styles.css"></head><body><main class="section" style="max-width:680px;margin:7vh auto"><div class="eyebrow">CONFIGURAÇÃO ÚNICA</div><h1>Ativar administração</h1><p>Use esta página uma única vez, depois de configurar o banco D1 e o segredo ADMIN_SETUP_TOKEN no Cloudflare. O administrador será <strong>Victor Velarian</strong>.</p><div class="portal-panel"><form id="setup"><label>Token de instalação<input name="setupToken" type="password" autocomplete="off" required></label><label>Senha do administrador (12 caracteres ou mais)<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><button class="primary" type="submit">Criar administrador</button></form><p id="result" role="status"></p></div><p><a href="/">← Voltar ao site</a></p></main><script>document.getElementById('setup').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/bootstrap',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();document.getElementById('result').textContent=d.error||d.message||'Concluído';if(r.ok)e.target.reset()})</script></body></html>
